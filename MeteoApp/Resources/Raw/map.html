<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mappa Meteo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100vw; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([46.2, 9.0], 8);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function sendToApp(message) {
        if (window.webkit?.messageHandlers?.invokeAction) {
            window.webkit.messageHandlers.invokeAction.postMessage(message);
        } else {
            window.location.href = 'js2csharp://' + encodeURIComponent(message);
        }
    }

    map.on('click', function (e) {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;
        sendToApp(`lat=${lat}&lon=${lon}`);
    });
</script>
</body>
</html>
